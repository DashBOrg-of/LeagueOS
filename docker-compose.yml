services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DASHBORG_DB_NAME:-dashborg}
      MARIADB_USER: ${DASHBORG_DB_USER:-dashborg}
      MARIADB_PASSWORD: ${DASHBORG_DB_PASSWORD:?DASHBORG_DB_PASSWORD must be supplied by the local fixture environment}
      MARIADB_ROOT_PASSWORD: ${DASHBORG_DB_ROOT_PASSWORD:?DASHBORG_DB_ROOT_PASSWORD must be supplied by the local fixture environment}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${DASHBORG_BIND_ADDRESS:-0.0.0.0}:${DASHBORG_HTTP_PORT:?DASHBORG_HTTP_PORT must be supplied by the local launcher}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DASHBORG_DB_NAME:-dashborg}
      WORDPRESS_DB_USER: ${DASHBORG_DB_USER:-dashborg}
      WORDPRESS_DB_PASSWORD: ${DASHBORG_DB_PASSWORD:?DASHBORG_DB_PASSWORD must be supplied by the local fixture environment}
      DASHBORG_LAN_URL: ${DASHBORG_LAN_URL:?DASHBORG_LAN_URL must be supplied by the local launcher}
      DASHBORG_WP_ADMIN_USER: ${DASHBORG_WP_ADMIN_USER:-localadmin}
      DASHBORG_WP_ADMIN_PASSWORD: ${DASHBORG_WP_ADMIN_PASSWORD:?DASHBORG_WP_ADMIN_PASSWORD must be supplied by the local fixture environment}
      DASHBORG_WP_ADMIN_EMAIL: ${DASHBORG_WP_ADMIN_EMAIL:-localadmin@dashborg.local}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${DASHBORG_LAN_URL}');
        define('WP_SITEURL', '${DASHBORG_LAN_URL}');
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wordpress-data:/var/www/html
      - ./wp-content/plugins/dashborg-leagueos:/var/www/html/wp-content/plugins/dashborg-leagueos:ro

volumes:
  db-data:
  wordpress-data:
